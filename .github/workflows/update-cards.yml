name: Update profile cards

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate cards and stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cards/gen.py

      - name: Commit changes
        run: |
          git add assets/cards assets/activity assets/badges/stat-*.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile cards and stats"
          git pull --rebase
          git push
