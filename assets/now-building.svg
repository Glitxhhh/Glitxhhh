<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>

    <pattern id="scan" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="transparent"/>
      <rect y="0" width="10" height="1" fill="#000" opacity="0.18"/>
    </pattern>

    <filter id="flicker">
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0.9 1 0.95 1"/>
      </feComponentTransfer>
    </filter>

    <style>
      .h { font: 800 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; letter-spacing: 1px; }
      .t { font: 600 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .m { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity: 0.9; }
    </style>
  </defs>

  <rect width="1201200" height="180" rx="18" fill="url(#bg)"/>
  <rect x="10" y="10" width="1180" height="160" rx="14" fill="none" stroke="#E0115F" stroke-width="4"/>

  <text x="40" y="55" fill="#ffffff" class="h">NOW BUILDING</text>
  <text x="40" y="95" fill="#ffffff" class="t">• Empress NFO Archive — curation, structure, long-term preservation</text>
  <text x="40" y="122" fill="#ffffff" class="t">• Denuvo Vortex (C++) — researching internals, retooling token tools, improvements</text>
  <text x="40" y="149" fill="#ffffff" class="t">• Hytale Tools — tooling for workflows, editor utilities, modding ecosystem support</text>

  <g filter="url(#flicker)">
    <rect x="830" y="40" width="320" height="8" fill="#E0115F" opacity="0.25">
      <animate attributeName="opacity" dur="1.4s" values="0.08;0.28;0.12;0.30;0.08" repeatCount="indefinite"/>
    </rect>
    <rect x="900" y="70" width="250" height="6" fill="#E0115F" opacity="0.18">
      <animate attributeName="opacity" dur="1.1s" values="0.06;0.22;0.10;0.24;0.06" repeatCount="indefinite"/>
    </rect>
    <rect x="860" y="145" width="290" height="5" fill="#E0115F" opacity="0.16">
      <animate attributeName="opacity" dur="1.6s" values="0.05;0.18;0.08;0.20;0.05" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="1200" height="180" fill="url(#scan)" opacity="0.25"/>
  <text x="40" y="170" fill="#ffffff" class="m">STATUS: shipping tools • breaking binaries • sleeping (allegedly)</text>
</svg>
