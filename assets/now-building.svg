<svg xmlns="http://www.w3.org/2000/svg" width="960" height="364" viewBox="0 0 960 364">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>

    <pattern id="scan" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="transparent"/>
      <rect y="0" width="10" height="1" fill="#000" opacity="0.14"/>
    </pattern>

    <style>
      .h { font: 800 30px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; letter-spacing: 3px; }
      .n { font: 700 23px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .d { font: 500 17px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .m { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="960" height="364" rx="18" fill="url(#bg)"/>
  <rect x="8" y="8" width="944" height="348" rx="14" fill="none" stroke="#E0115F" stroke-width="3"/>

  <text x="48" y="70" fill="#ffffff" class="h">NOW BUILDING</text>
  <rect x="48" y="86" width="64" height="4" rx="2" fill="#E0115F"/>

  <rect x="48" y="118" width="6" height="42" rx="3" fill="#E0115F"/>
  <text x="72" y="136" fill="#ffffff" class="n">Wand-Enhancer</text>
  <text x="72" y="158" fill="#9aa4b8" class="d">Community continuation · remote panel · custom scripts</text>

  <rect x="48" y="184" width="6" height="42" rx="3" fill="#E0115F"/>
  <text x="72" y="202" fill="#ffffff" class="n">YipYip-Recomp</text>
  <text x="72" y="224" fill="#9aa4b8" class="d">Avatar: The Last Airbender (PS2), statically recompiled to C++</text>

  <rect x="48" y="250" width="6" height="42" rx="3" fill="#E0115F"/>
  <text x="72" y="268" fill="#ffffff" class="n">TTGames Lego Mod Manager</text>
  <text x="72" y="290" fill="#9aa4b8" class="d">Mods for Nu2 / NXG / NTT engine LEGO games</text>

  <g opacity="0.9">
    <rect x="760" y="36" width="150" height="6" rx="3" fill="#E0115F" opacity="0.25">
      <animate attributeName="opacity" dur="1.4s" values="0.08;0.28;0.12;0.30;0.08" repeatCount="indefinite"/>
    </rect>
    <rect x="810" y="52" width="100" height="5" rx="2.5" fill="#E0115F" opacity="0.18">
      <animate attributeName="opacity" dur="1.1s" values="0.06;0.22;0.10;0.24;0.06" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="960" height="340" rx="18" fill="url(#scan)" opacity="0.25"/>
  <text x="48" y="338" fill="#6f7a90" class="m">shipping tools • breaking binaries • sleeping (allegedly)</text>
</svg>
